# Production stack on the VPS: the Next.js app behind Caddy (HTTPS), and
# PostgreSQL. Driven by deploy.sh, which writes TAG and POSTGRES_PASSWORD to
# deploy/.env (server-only, git-ignored). See README.md.
name: larutina

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-database-url: &database-url postgresql://larutina:${POSTGRES_PASSWORD:-}@db:5432/larutina

services:
  web:
    image: larutina-web:${TAG:-latest}
    build:
      context: ../code
      target: run
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-larutinabeauty.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      # Optional: where unhandled server errors are reported (INF-04); see monitor.sh.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Uploaded files in Cloudflare R2. Without these the app keeps using the
      # media volume below.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
    # Start order only: the app opens its database connection on first use.
    depends_on:
      - db
    volumes:
      - next-cache:/app/.next/cache
      - media:/app/storage
    logging: *logging

  # Reachable only from the other containers; no port is published.
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: larutina
      POSTGRES_DB: larutina
      # Applies only when the data volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larutina -d larutina"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    logging: *logging

  # One-shot `prisma migrate deploy` for the commit being deployed. Never
  # started by `up`; deploy.sh runs it before switching the app.
  migrate:
    image: larutina-migrate:${TAG:-latest}
    build:
      context: ../code
      target: migrate
    profiles: [tools]
    environment:
      DATABASE_URL: *database-url
      # Shown by larutina-admin (scripts/admin.ts) after creating a user.
      PANEL_URL: https://admin.${SITE_DOMAIN:-larutinabeauty.com}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-larutinabeauty.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  next-cache:
  media:
  db-data:
  caddy-data:
  caddy-config:
